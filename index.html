<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PinPix</title>
    <meta name="description" content="PinPix — a community for discovering and sharing photography spots." />

    <!-- Google site verification: replace the content value with the one Search Console gave you -->
    <meta name="google-site-verification" content="<meta name="google-site-verification" content="6lmeot9Zs5n_lGlZ0PnhJAys6LSO9TNqANg7NUR7wVo" />" />

    <style>
      :root {
        --navy: #112337;
        --orange: #e35c25;
        --cream: #e7dbcb;
        --text: #1a1a1a;
        --muted: #4a5568;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: var(--text);
        background: #fff;
      }
      .hero {
        background: var(--navy);
        color: var(--cream);
        padding: 4rem 1.25rem 3rem;
        text-align: center;
      }
      .hero h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .hero p {
        margin: 0;
        font-size: 1.05rem;
        color: #cbb89c;
      }
      .accent { color: var(--orange); }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      h2 {
        margin: 0 0 1rem;
        font-size: 1.25rem;
        color: var(--navy);
      }
      .links {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .links li { margin-bottom: 0.75rem; }
      .links a {
        display: inline-block;
        padding: 0.75rem 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        text-decoration: none;
        color: var(--navy);
        font-weight: 600;
        background: #f8fafc;
      }
      .links a:hover {
        border-color: var(--orange);
        color: var(--orange);
      }
      footer {
        max-width: 42rem;
        margin: 0 auto;
        padding: 0 1.25rem 3rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      footer a { color: var(--orange); }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>Pin<span class="accent">Pix</span></h1>
      <p>Discover and share the best photo spots.</p>
    </section>

    <main>
      <h2>Legal &amp; Support</h2>
      <ul class="links">
        <li><a href="privacy.html">Privacy Policy</a></li>
        <li><a href="terms.html">Terms of Service</a></li>
        <li><a href="mailto:pinpixhelp@gmail.com">Contact Support</a></li>
      </ul>
    </main>

    <footer>
      &copy; PinPix. Questions? <a href="mailto:pinpixhelp@gmail.com">pinpixhelp@gmail.com</a>
    </footer>
  </body>
</html>
